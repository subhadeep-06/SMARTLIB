server:
  port: ${PORT:8080}

spring:
  application:
    name: smartlib-enterprise
  jackson:
    time-zone: Asia/Kolkata
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/smartlib}
      database: ${MONGODB_DATABASE:smartlib}
      auto-index-creation: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

smartlib:
  env: ${APP_ENV:development}
  localization:
    country: India
    currency: INR
    locale: en-IN
    timezone: Asia/Kolkata
    date-format: dd/MM/yyyy
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:dev-only-replace-with-256-bit-secret-before-production-deploy}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
